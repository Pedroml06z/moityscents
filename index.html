<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

</head>
<body>
<title>Moity Scents</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Decants de perfumes originales de diseñador y árabes, 5 ml y 10 ml. Envíos a todo México.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Diseño de Pedro (Claude Design): negro cálido, dorado, Cormorant + Jost. Una sola apariencia oscura. */
:root{
  color-scheme:dark;
  --bg:#181818; --band:#242424; --card:#212121; --sheet:#1f1f1f; --field:#1b1b1b; --ph:#262626;
  --line:#2f2f2f; --line2:#3d3d3d; --line3:#333;
  --fg:#f2efea; --soft:#dcd7cf; --mute:#c4bfb6; --dim:#a09a90; --faint:#8f8a82;
  --gold:#c9a961; --gold2:#d8bb7a; --ink:#161616; --warn:#e0a48f;
  --serif:'Cormorant Garamond',Garamond,'Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--band)}
a{color:var(--gold);text-decoration:none}a:hover{color:#e2c98f}
button{font:inherit;color:inherit}
input{font-family:var(--sans)}
input::placeholder{color:var(--faint)}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.serif{font-family:var(--serif)}
.eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 24px;border:none;cursor:pointer;font-size:13px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
.btn-gold{background:var(--gold);color:var(--ink);font-weight:500}.btn-gold:hover{background:var(--gold2);color:var(--ink)}
.btn-line{background:transparent;color:var(--fg);border:1px solid #4a4a4a}.btn-line:hover{border-color:var(--gold)}
.btn-outline-gold{background:transparent;color:var(--gold);border:1px solid var(--gold)}.btn-outline-gold:hover{background:var(--gold);color:var(--ink)}
.chip{height:40px;padding:0 16px;background:transparent;color:var(--soft);border:1px solid var(--line2);font-size:13px;letter-spacing:.08em;cursor:pointer}
.chip:hover{border-color:var(--gold)}
.chip .n{color:var(--faint);margin-left:4px}
.chip.on{background:var(--fg);color:var(--ink);border-color:var(--fg);font-weight:400}
.chip.on .n{color:var(--ink);opacity:.6}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(36,36,36,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line3)}
.top .wrap{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg)}
.logo-sm{width:38px;height:38px;overflow:hidden;flex:none}
.logo-sm img{width:38px;height:38px;object-fit:cover;transform:scale(2.05);display:block}
.wordmark{font-family:var(--serif);font-size:15px;letter-spacing:.28em;font-weight:500}
.dm{display:flex;align-items:center;height:36px;padding:0 14px;border:1px solid var(--gold);color:var(--gold);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:400;white-space:nowrap}

/* Hero */
.hero{background:var(--band)}
.hero-in{padding-top:18px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo-lg{width:300px;max-width:100%;height:184px;overflow:hidden;display:flex;justify-content:center}
.logo-lg img{width:300px;height:300px;max-width:none;margin-top:-58px;display:block}
.hero h1{margin:14px 0 0;font-family:var(--serif);font-weight:300;font-size:clamp(38px,6vw,68px);line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
.hero h1 em{color:var(--gold)}
.hero p{margin:16px 0 0;max-width:460px;font-size:16px;line-height:1.55;color:var(--mute);text-wrap:pretty}
.hero .ctas{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.hero-img{margin-top:34px}
.hero-img img{width:100%;height:clamp(260px,44vw,520px);object-fit:cover;object-position:50% 60%;display:block}
.steps{background:var(--band);border-bottom:1px solid #303030}
.steps .wrap{padding-top:28px;padding-bottom:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 28px}
.step{display:flex;gap:14px;align-items:baseline}
.step b{font-family:var(--serif);font-size:22px;color:var(--gold);font-style:italic;font-weight:400}
.step span{font-size:15px;line-height:1.45;color:var(--soft)}

/* Menu */
.menu{padding-top:40px;padding-bottom:20px}
.tools{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.search{flex:1 1 300px;max-width:440px;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:#222;border:1px solid #363636}
.search i{width:12px;height:12px;border:1.5px solid var(--faint);border-radius:50%;flex:none}
.search input{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:var(--fg);font-size:16px;font-weight:300}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.sec{margin-top:40px}
.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.sec-h h2{margin:0;font-family:var(--serif);font-weight:400;font-size:34px}
.sec-h .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--gold),rgba(201,169,97,0))}
.sec-h .ct{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9d978d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,22vw,250px),1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);min-width:0}
.ph{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:#2a2a2a}
.ph>img{width:100%;height:100%;object-fit:cover;object-position:50% 82%;transform:scale(1.12);transform-origin:50% 80%;display:block}
.noimg{position:absolute;inset:0;background:var(--ph);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.noimg::before{content:"";position:absolute;inset:10px;border:1px solid #3a3a3a}
.noimg .ini{font-family:var(--serif);font-style:italic;font-weight:300;font-size:58px;line-height:1;color:var(--gold)}
.noimg .bar{width:28px;height:1px;background:var(--gold)}
.noimg .soon{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.tag{position:absolute;top:10px;left:10px;padding:5px 8px;background:rgba(22,22,22,.82);color:var(--fg);font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:400}
.sold{position:absolute;inset:0;background:rgba(24,24,24,.62);display:flex;align-items:center;justify-content:center}
.sold span{padding:8px 14px;border:1px solid var(--fg);color:var(--fg);font-size:12px;letter-spacing:.24em;text-transform:uppercase;background:rgba(24,24,24,.6)}
.body{padding:14px 12px 12px;display:flex;flex-direction:column;flex:1;gap:4px}
.body h3{margin:0;font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.12;text-wrap:balance;overflow-wrap:anywhere}
.body .sp{flex:1;min-height:10px}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.size{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 9px;background:transparent;border:1px solid var(--line2);cursor:pointer;text-align:left;min-width:0}
.size:hover:not(:disabled){border-color:var(--gold)}
.size:disabled{cursor:not-allowed;opacity:.55}
.size small{font-size:10.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.size strong{font-size:16px;font-weight:400;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center}
.empty{margin-top:40px;padding:44px 20px;border:1px solid var(--line3);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{font-family:var(--serif);font-size:28px;font-weight:400}
.empty span{max-width:380px;font-size:15px;line-height:1.5;color:var(--mute)}
.hint{margin:28px 0 0;font-size:13px;color:#9d978d;text-align:center}
.quote{margin-top:40px}
.quote-box{display:flex;flex-wrap:wrap;background:var(--band);border:1px solid var(--line3)}
.quote-img{flex:1 1 300px;min-height:320px;position:relative;overflow:hidden}
.quote-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.quote-txt{flex:1 1 300px;min-width:0;padding:clamp(28px,5vw,64px) clamp(22px,4vw,56px);display:flex;flex-direction:column;justify-content:center;gap:16px;align-items:flex-start}
.quote-txt h2{margin:0;font-family:var(--serif);font-weight:300;font-size:clamp(34px,4.4vw,52px);line-height:1.04;text-wrap:balance}
.quote-txt p{margin:0;font-size:16px;line-height:1.55;color:var(--mute)}
.foot{padding-top:48px;padding-bottom:40px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.foot .wordmark{font-size:18px;letter-spacing:.32em}
.foot .s{font-size:14px;color:var(--dim)}
.foot .l{display:flex;gap:10px 22px;font-size:14px;flex-wrap:wrap;justify-content:center}
.foot .adm{font-size:12px;color:#5f5b55}

/* Bolsa */
.bagbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px var(--gr) calc(10px + env(safe-area-inset-bottom,0px)) var(--gl);background:linear-gradient(0deg,var(--bg) 60%,rgba(24,24,24,0))}
.bagbar button{max-width:560px;margin:0 auto;width:100%;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;background:var(--gold);color:var(--ink);border:none;cursor:pointer}
.bagbar button:hover{background:var(--gold2)}
.bagbar .a{font-size:14px;font-weight:400}
.bagbar .b{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding:20px;z-index:50}
.overlay .scrim{position:absolute;inset:0}
.sheet{position:relative;width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--sheet);border-top:1px solid var(--gold);padding:22px var(--gr) calc(18px + env(safe-area-inset-bottom,0px)) var(--gl)}
@media(min-width:600px){.sheet{padding-left:22px;padding-right:22px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h2{margin:0;font-family:var(--serif);font-weight:400;font-size:30px}
.x{width:44px;height:44px;background:transparent;border:none;color:var(--mute);font-size:24px;cursor:pointer}
.line{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line3)}
.line .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.line .nm{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.15}
.line .meta{font-size:13px;color:var(--dim)}
.qty{display:flex;align-items:center;border:1px solid var(--line2)}
.qty button{width:40px;height:40px;background:transparent;border:none;font-size:18px;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-size:15px}
.line .tot{width:64px;text-align:right;font-size:16px;font-weight:400;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px}
.total span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.total b{font-family:var(--serif);font-size:30px;font-weight:500}
.note{margin:0 0 16px;font-size:13px;color:var(--dim)}
.send{width:100%;height:54px;font-size:13px;letter-spacing:.14em}
.msg{margin:12px 0 0;font-size:14px;color:var(--soft);text-align:center}
.msg.d{font-size:13px;color:var(--dim)}
.link{margin:10px auto 0;display:block;height:40px;background:transparent;border:none;color:var(--dim);font-size:13px;text-decoration:underline;cursor:pointer}
.orderbox{width:100%;margin-top:10px;min-height:120px;background:var(--field);border:1px solid var(--line2);color:var(--fg);font:14px/1.5 var(--sans);padding:10px}

/* Panel */
.ptop{background:var(--band);backdrop-filter:none}
.ptop .wrap,.pmain{max-width:1100px}
.sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.pmain{padding-top:30px;padding-bottom:60px}
.phead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.phead h1{margin:0;font-family:var(--serif);font-weight:300;font-size:42px;line-height:1}
.phead .sum{font-size:14px;color:var(--dim)}
.pbar{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pbar .chip{height:38px;padding:0 14px;letter-spacing:0}
.saved{font-size:12px;color:var(--faint)}
.rows{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;padding:12px;background:var(--card);border:1px solid var(--line)}
.row .l{display:flex;align-items:center;gap:14px;flex:1 1 260px;min-width:0}
.thumb{position:relative;width:68px;height:85px;flex:none;overflow:hidden;cursor:pointer;background:var(--ph);border:1px solid #3a3a3a;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:50% 82%;transform:scale(1.12);transform-origin:50% 80%;display:block}
.thumb .chg{position:absolute;left:0;right:0;bottom:0;padding:3px 0;background:rgba(22,22,22,.78);font-size:9px;letter-spacing:.12em;text-transform:uppercase;text-align:center;color:var(--fg)}
.up{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--gold);text-align:center}
.up b{font-size:22px;line-height:1;font-weight:300}
.up span{font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.thumb input,.bigthumb input{display:none}
.row .who{display:flex;flex-direction:column;gap:3px;min-width:0}
.row .who .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line2);padding:2px 6px}
.row .nm{font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.15;overflow-wrap:anywhere}
.row .so{font-size:12px;color:var(--warn)}
.row .r{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;flex:1 1 340px;justify-content:space-between}
.prices{display:flex;gap:8px}
.pf{display:flex;flex-direction:column;gap:4px}
.pf>span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.money{display:flex;align-items:center;height:42px;padding:0 10px;border:1px solid var(--line2);background:var(--field);gap:4px}
.money i{color:var(--faint);font-style:normal}
.money input{width:56px;background:transparent;border:none;outline:none;color:var(--fg);font-size:16px}
.toggle{display:flex;align-items:center;gap:10px;height:44px;padding:0 4px;background:transparent;border:none;cursor:pointer}
.sw{position:relative;width:40px;height:22px;border-radius:11px;background:var(--line2);flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--faint);transition:left .15s}
.toggle.on .sw{background:var(--gold)}
.toggle.on .sw::after{left:21px;background:var(--ink)}
.toggle .lb{font-size:14px;width:82px;text-align:left;color:var(--dim)}
.toggle.on .lb{color:var(--fg)}
.acts{display:flex;gap:6px}
.sbtn{height:42px;padding:0 14px;background:transparent;border:1px solid var(--line2);font-size:13px;cursor:pointer}
.sbtn:hover{border-color:var(--gold)}
.sbtn.red{color:var(--warn)}.sbtn.red:hover{border-color:var(--warn)}
.none{padding:40px 20px;border:1px dashed var(--line2);text-align:center;color:var(--dim);font-size:15px}
.form{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.fl>input,.field{height:48px;padding:0 12px;background:var(--field);border:1px solid var(--line2);outline:none;color:var(--fg);font-size:16px;width:100%}
.field{display:flex;align-items:center;gap:6px}
.field i{color:var(--faint);font-style:normal}
.field input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--fg);font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2)}
.seg button{height:46px;background:transparent;color:var(--soft);border:none;font-size:14px;cursor:pointer}
.seg button.on{background:var(--fg);color:var(--ink);font-weight:400}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.photo{margin-top:14px;display:flex;gap:16px;align-items:stretch}
.bigthumb{position:relative;width:120px;aspect-ratio:4/5;flex:none;overflow:hidden;cursor:pointer;background:var(--ph);border:1px solid #3a3a3a;display:flex;align-items:center;justify-content:center}
.bigthumb img{width:100%;height:100%;object-fit:cover;object-position:50% 82%;display:block}
.photo .tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px;font-size:13px;line-height:1.5;color:var(--dim)}
.err{margin:6px 0 0;font-size:13px;color:var(--warn)}
.foot2{margin-top:18px;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.foot2 .btn{height:52px;padding:0 10px;font-size:13px;letter-spacing:.12em}
.dialog{width:100%;max-width:380px;background:var(--sheet);border:1px solid #3a3a3a;padding:24px 20px;display:flex;flex-direction:column;gap:10px;position:relative}
.dialog b{font-family:var(--serif);font-size:26px;line-height:1.1;font-weight:400}
.dialog p{margin:0;font-size:14px;color:var(--dim);line-height:1.5}
.dialog .two{margin-top:10px}
.dialog .two button{height:48px;font-size:13px;cursor:pointer;border:1px solid var(--line2);background:transparent}
.dialog .two .del{background:var(--warn);border:none;color:var(--ink);font-weight:500}
.login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-family:var(--serif);font-weight:300;font-size:40px}
.demo{margin-top:14px;padding:10px 12px;border:1px solid #4a3f26;background:#211d14;color:#d9c79c;font-size:13px;line-height:1.5}
.busy{opacity:.5;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div id="app"></div>

<script>
/* Configuración de la nube (Supabase). Vacío = modo demo, los datos se guardan solo en este navegador. */
window.MOITY_CONFIG = window.MOITY_CONFIG || { supabaseUrl: '', supabaseKey: '' };

<script>
(function(){
const IG = 'https://ig.me/m/moityscents';
const KEY = 'moity-menu-v1';
const CFG = window.MOITY_CONFIG || {};
const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseKey);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => '$' + Number(n || 0).toLocaleString('es-MX');
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const typeLabel = t => t === 'arabe' ? 'Árabe' : 'Diseñador';

const DEFAULTS = [

let sb = null;
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
const fromRow = r => ({ id:r.id, brand:r.brand, name:r.name, type:r.type, p5:r.p5, p10:r.p10, img:r.img || '', soldOut:!!r.sold_out, sort:r.sort || 0 });
const toRow = p => ({ id:p.id, brand:p.brand, name:p.name, type:p.type, p5:p.p5, p10:p.p10, img:p.img || '', sold_out:!!p.soldOut, sort:p.sort || 0 });

const Store = {
  async init(){
    if (!CLOUD) return;
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
  },
  async list(){
    if (CLOUD){
      const { data, error } = await sb.from('perfumes').select('*').order('sort').order('brand');
      if (error) throw error;
      return data.map(fromRow);
    }
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s) && s.length) return s; } catch(e){}
    return DEFAULTS.map(p => ({...p}));
  },
  async saveAll(items, changed){
    if (CLOUD){
      if (changed){ const { error } = await sb.from('perfumes').upsert(toRow(changed)); if (error) throw error; }
      return;
    }
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){ throw new Error('No se pudo guardar en este navegador (¿fotos muy pesadas?).'); }
  },
  async remove(id, items){
    if (CLOUD){ const { error } = await sb.from('perfumes').delete().eq('id', id); if (error) throw error; return; }
    return Store.saveAll(items);
  },
  async photo(file){
    const blob = await shrink(file);
    if (CLOUD){
      const path = 'p' + Date.now() + '.jpg';
      const { error } = await sb.storage.from('fotos').upload(path, blob, { contentType:'image/jpeg', upsert:true });
      if (error) throw error;
      return sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
    }
    return await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
  },
  async session(){ if (!CLOUD) return true; const { data } = await sb.auth.getSession(); return !!data.session; },
  async login(email, pw){ const { error } = await sb.auth.signInWithPassword({ email, password: pw }); if (error) throw error; },
  async logout(){ if (CLOUD) await sb.auth.signOut(); }
};

function shrink(file){
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onerror = no;
    r.onload = () => {
      const im = new Image();
      im.onerror = () => no(new Error('No se pudo leer la foto.'));
      im.onload = () => {
        const s = Math.min(1, 900 / im.width), c = document.createElement('canvas');
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        c.toBlob(b => b ? ok(b) : no(new Error('No se pudo procesar la foto.')), 'image/jpeg', 0.82);
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function bump(key, d){

  menuRender();
}

function bagLines(){
  const byId = Object.fromEntries(items.map(p => [p.id, p]));
  return Object.entries(M.bag).filter(([k,n]) => n>0 && byId[k.split('|')[0]]).map(([k,n]) => {
    const [id, size] = k.split('|'); const p = byId[id]; const unit = size==='5' ? p.p5 : p.p10;
    return { key:k, p, size:size+' ml', qty:n, unit, total:unit*n };
  });
}

    `\n\nTotal: ${fmt(total)}\n¿Me confirman el envío?`;
}

  const d = P.editing;
  if (!d){ m.innerHTML = ''; return; }
  const invalid = !d.brand.trim() || !d.name.trim() || !d.p5 || !d.p10;
  m.innerHTML = `<div class="overlay"><div class="scrim" data-x></div><div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-h"><h2>${d.isNew?'Nuevo perfume':'Editar perfume'}</h2><button class="x" data-x aria-label="Cerrar">×</button></div>
    <div class="photo">
      <label class="bigthumb">${d.img ? `<img src="${esc(d.img)}" alt="Foto">` : '<span class="up" style="padding:8px"><b style="font-size:28px">+</b><span style="font-size:10px">Subir foto</span></span>'}<input type="file" accept="image/*" id="dfile"></label>
      <div class="tx"><span>Usa la foto del frasco junto a los decants de 5 y 10 ml, en vertical.</span>
        ${d.img ? '<button class="link" id="noimg" style="margin:0;color:var(--warn);text-align:left;height:36px;padding:0">Quitar foto</button>' : '<span>Sin foto se muestra con las iniciales de la marca.</span>'}</div>
    </div>
    <div class="form">
      <label class="fl"><span>Marca</span><input id="dbrand" value="${esc(d.brand)}" placeholder="Ej. Lattafa"></label>
      <label class="fl"><span>Nombre del perfume</span><input id="dname" value="${esc(d.name)}" placeholder="Ej. Khamrah"></label>
      <div class="fl"><span>Tipo</span><div class="seg"><button class="${d.type!=='arabe'?'on':''}" data-type="disenador">Diseñador</button><button class="${d.type==='arabe'?'on':''}" data-type="arabe">Árabe</button></div></div>
      <div class="two">
        <label class="fl"><span>Precio 5 ml</span><span class="field"><i>$</i><input id="d5" type="number" inputmode="numeric" min="0" value="${esc(d.p5)}"></span></label>
        <label class="fl"><span>Precio 10 ml</span><span class="field"><i>$</i><input id="d10" type="number" inputmode="numeric" min="0" value="${esc(d.p10)}"></span></label>
      </div>
      <button class="toggle ${d.soldOut?'':'on'}" id="dsold" style="height:48px;padding:0"><span class="sw"></span><span class="lb" style="font-size:15px">${d.soldOut?'Agotado':'Disponible'}</span></button>
    </div>
    ${P.tried && invalid ? '<p class="err">Completa marca, nombre y ambos precios.</p>' : ''}
    <div class="foot2"><button class="btn btn-line" data-x>Cancelar</button><button class="btn btn-gold" id="dsave">${d.isNew?'Agregar al menú':'Guardar cambios'}</button></div>
  </div></div>`;
  const keep = () => { d.brand = $('#dbrand').value; d.name = $('#dname').value; d.p5 = num($('#d5').value); d.p10 = num($('#d10').value); };
  m.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { P.editing = null; modalRender(); });
  m.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { keep(); d.type = b.dataset.type; modalRender(); });
  $('#dsold').onclick = () => { keep(); d.soldOut = !d.soldOut; modalRender(); };
  if ($('#noimg')) $('#noimg').onclick = () => { keep(); d.img = ''; modalRender(); };
  $('#dfile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; keep();
    const box = m.querySelector('.bigthumb'); box.classList.add('busy');
    try { d.img = await Store.photo(f); } catch(err){ alertInline('No se pudo subir la foto.'); }
    modalRender();
  };
  $('#dsave').onclick = () => {
    keep();
    if (!d.brand.trim() || !d.name.trim() || !d.p5 || !d.p10){ P.tried = true; modalRender(); return; }
    const { isNew, ...clean } = d; clean.brand = clean.brand.trim(); clean.name = clean.name.trim();
    P.editing = null; modalRender();
    commit(isNew ? [...items, clean] : items.map(p => p.id === clean.id ? clean : p), clean);
  };
}
function alertInline(t){ setSaved(t, true); }

/* ================= Arranque ================= */
function route(){
  window.scrollTo(0, 0);
  document.body.style.paddingBottom = '0';
  if (location.hash === '#panel') panelEnter(); else menuShell();
}
window.addEventListener('hashchange', route);
(async () => {
  $('#app').innerHTML = '<p style="text-align:center;padding:80px 16px;color:var(--dim)">Cargando menú…</p>';
  try { await Store.init(); items = await Store.list(); }
  catch(e){ items = DEFAULTS.map(p => ({...p})); console.error(e); }
  route();
})();
})();
</script>

</body>
</html>
